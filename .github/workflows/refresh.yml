name: Refresh Facebook posts

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.44.0"
          playwright install chromium

      - name: Run scraper
        continue-on-error: true
        run: python scripts/refresh_cards.py

      - name: Commit if changed
        run: |
          git config user.name "hon-jonas-bot"
          git config user.email "hon-jonas-bot@users.noreply.github.com"
          git add index.html data/latest_posts.json || true
          if git diff --cached --quiet; then
            echo "No content changes — nothing to commit."
          else
            git commit -m "auto: refresh Facebook posts"
            git push
          fi
